services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edora
      POSTGRES_USER: edora
      POSTGRES_PASSWORD: edora
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["edora_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edora -d edora"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://edora:edora@db:5432/edora
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  edora_data:
